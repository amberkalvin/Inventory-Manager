name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'android_app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to attach Inventory_Manager.apk to'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Build Signed Release APK
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          chmod +x ./android_app/build_apk.sh
          ./android_app/build_apk.sh

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inventory_Manager-apk
          path: Inventory_Manager.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag || 'v1.0.0' }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Inventory Manager $TAG" \
              --notes "Automated release packages for Android (.apk) and iOS (.ipa)." || true
          fi
          gh release upload "$TAG" Inventory_Manager.apk --clobber
