plugins {
    id 'com.android.application'
}

android {
    namespace 'com.inventorymanager.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.inventorymanager.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def ksFile = file("${rootProject.projectDir}/release.keystore")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "inventorymanager"
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "inventorymanager"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: "inventorymanager"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def ksFile = file("${rootProject.projectDir}/release.keystore")
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation(platform('org.jetbrains.kotlin:kotlin-bom:1.8.22'))
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}

