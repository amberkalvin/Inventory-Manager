name: InventoryManager
options:
  bundleIdPrefix: com.inventorymanager
  deploymentTarget:
    iOS: "15.0"
  generateEmptyDirectories: true
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
targets:
  InventoryManager:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: InventoryManager
        excludes:
          - WebApp
          - Info.plist
      - path: InventoryManager/WebApp
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inventorymanager.app
        PRODUCT_NAME: InventoryManager
        INFOPLIST_FILE: InventoryManager/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
